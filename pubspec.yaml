name: pendaki_local_guide_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.0

  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # 🌊 State Management & Logic
  # flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.1

  # 🎨 Phase 2: Animations (The "Gojek x Jago" Arsenal)
  lottie: ^2.3.2        # Untuk ilustrasi pasif & loading
  rive: 0.12.3       # Untuk ikon interaktif & micro-interactions
  
  # 🚀 Phase 3: API Integration (The "Laravel API" Arsenal)
  dio: ^5.3.0

  # 🚀 Networking (Jika nanti konek ke API Laravel)
  http: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/animations/  # Untuk file .lottie atau .json
    - assets/rive/        # Untuk file .riv (Rive)
    - assets/images/      # Untuk gambar statis jika ada

